<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Fake Data Filler</title><link rel="stylesheet" href="popup.css" /></head>
<body><main class="app">
  <header><div class="logo" aria-hidden="true">✦</div><div class="brand"><h1>Fake Data Filler</h1><p>Instantly fill test forms with believable data.</p></div><div class="header-actions"><button id="theme-toggle" class="theme-button" title="Change appearance" aria-label="Change appearance"><span id="theme-icon">◐</span><em id="theme-label">System</em></button><button id="regenerate" class="round-button" title="Generate a new identity" aria-label="Generate a new identity">↻</button></div></header>
  <section class="identity-card" aria-labelledby="name"><div class="identity-top"><span class="eyebrow">IDENTITY #<span id="identity-number"></span></span><span class="local-badge">● LOCAL ONLY</span></div><h2 id="name"></h2><p id="email"></p><div class="quick-values"><button class="copy-item" data-copy="phone"><span>PHONE</span><b id="phone"></b><i>⧉</i></button><button class="copy-item" data-copy="password"><span>PASSWORD</span><b id="password"></b><i>⧉</i></button></div></section>
  <section class="details-card" aria-labelledby="extra-title"><div class="section-heading"><h3 id="extra-title">Extra details</h3><span>Tap to copy</span></div><div class="detail-grid"><button class="copy-item" data-copy="company"><span>COMPANY</span><b id="company"></b><i>⧉</i></button><button class="copy-item" data-copy="address"><span>ADDRESS</span><b id="address"></b><i>⧉</i></button><button class="copy-item" data-copy="city"><span>CITY</span><b id="city"></b><i>⧉</i></button><button class="copy-item" data-copy="zip"><span>ZIP CODE</span><b id="zip"></b><i>⧉</i></button></div></section>
  <section class="field-picker" aria-labelledby="fields-title"><div class="section-heading"><h3 id="fields-title">What should I fill?</h3><button id="toggle-all" class="text-button">All fields</button></div><div class="chips"><label><input type="checkbox" value="identity" checked /><span>Identity</span></label><label><input type="checkbox" value="contact" checked /><span>Contact</span></label><label><input type="checkbox" value="security" checked /><span>Password</span></label><label><input type="checkbox" value="address" checked /><span>Address</span></label></div></section>
  <button id="fill" class="fill-button"><span class="spark">✦</span> Fill selected fields <span class="arrow">→</span></button><p id="status" class="status" role="status" aria-live="polite">Ready when you are.</p><footer><span>⌁</span> Private by design · Generated on your device</footer>
</main><script src="popup.js"></script></body></html>
